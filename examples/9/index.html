<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#9 カラーピッカー | sandbox</title>
<link rel="stylesheet" href="/assets/examples-header.css">
<script src="/assets/examples-header.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  カラーピッカー（旧 tools.yoshina.moe/tools/colorpicker/ のメイン領域を移したもの）。
  左に画像（スポイト・頻出色）、右に色のペイン（現在色と HSV・パレット・画像への合成）。
  画像はブラウザの中だけで扱い、サーバーへは送らない。計算も全部 main.js の中。
  見た目は Design System「Sandbox No.12」（/designsheets/2 ツール デザインサンプル）に合わせている。
-->
<link rel="stylesheet" href="/examples/9/main.css">
</head>
<body>
<header class="app">
    <div class="logo">
        <span class="logo-mark" aria-hidden="true">Cp</span>
        <h1 class="logo-name">Color Picker</h1>
    </div>
    <div class="spacer"></div>
    <span class="hint">画像から色を拾い、パレットにまとめたり画像に重ねたりします。</span>
</header>

<noscript>
    <p class="msg err cp-noscript">JavaScript が無効なので使えません。</p>
</noscript>

<main class="cp-main" id="cp_main">
    <div class="cp-col cp-col--image">
        <section class="pane">
            <div class="pane-head">
                <h2 class="pane-title">画像</h2>
                <span class="pane-meta" id="cp_image_info"></span>
                <span class="pane-actions">
                    <button type="button" id="cp_remove" class="btn icon tip" data-tip="除去" data-pos="bottom" data-align="end" aria-label="画像を除去" hidden><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
                </span>
            </div>
            <div class="pane-body cp-image-body">
                <label class="cp-drop" id="cp_drop">
                    <input type="file" id="cp_file" class="cp-file" accept="image/*">
                    <canvas id="cp_canvas" class="cp-canvas" hidden></canvas>
                    <span class="cp-drop__icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg></span>
                    <span class="cp-drop__hint" id="cp_drop_hint">画像を選択</span>
                </label>

                <div class="cp-sample">
                    <span class="field-label" id="cp_sample_label">サンプル範囲</span>
                    <div class="seg" role="radiogroup" aria-labelledby="cp_sample_label">
                        <label><input type="radio" name="cp_sample" value="1" checked><span>1px</span></label>
                        <label><input type="radio" name="cp_sample" value="3"><span>3×3</span></label>
                        <label><input type="radio" name="cp_sample" value="5"><span>5×5</span></label>
                    </div>
                    <span class="cp-hover" id="cp_hover" aria-live="off">
                        <span class="cp-hover__sw" id="cp_hover_sw"></span>
                        <span class="cp-hover__hex" id="cp_hover_hex"></span>
                    </span>
                </div>

                <p class="msg info" data-icon="info">アップロードした画像がサーバーに送信されることはありません。</p>
            </div>
        </section>

        <section class="pane">
            <div class="pane-head">
                <h2 class="pane-title">頻出色</h2>
            </div>
            <div class="pane-body">
                <div id="cp_frequent" class="cp-chips" role="group" aria-label="頻出色"></div>
            </div>
        </section>
    </div>

    <div class="cp-col cp-col--color">
        <section class="pane">
            <div class="pane-head">
                <h2 class="pane-title">現在色</h2>
                <span class="pane-actions">
                    <button type="button" id="cp_copy" class="btn icon tip" data-tip="コピー" data-pos="bottom" aria-label="HEX をコピー"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
                    <button type="button" id="cp_hold" class="btn primary"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg><span class="btn__text">パレットに追加</span></button>
                </span>
            </div>
            <div class="pane-body cp-stack">
                <div class="cp-current">
                    <button type="button" id="cp_current_sw" class="cp-current__sw tip" data-tip="パレットに追加" aria-label="パレットに追加"></button>
                    <div class="cp-current__values">
                        <label class="cp-current__hex"><span class="field-label">HEX</span>
                            <input type="text" id="cp_hex" class="in in--hex" maxlength="7" spellcheck="false" autocomplete="off">
                        </label>
                        <span class="cp-current__rgb" id="cp_rgb"></span>
                        <span class="cp-current__hsv" id="cp_hsv_text"></span>
                    </div>
                </div>
                <div class="cp-hsv">
                    <label class="cp-hsv__row">
                        <span>H</span>
                        <input type="range" id="cp_h" min="0" max="360" step="1">
                        <output></output>
                    </label>
                    <label class="cp-hsv__row">
                        <span>S</span>
                        <input type="range" id="cp_s" min="0" max="100" step="1">
                        <output></output>
                    </label>
                    <label class="cp-hsv__row">
                        <span>V</span>
                        <input type="range" id="cp_v" min="0" max="100" step="1">
                        <output></output>
                    </label>
                </div>
                <p class="msg info" data-icon="info" id="cp_current_note" aria-live="polite"></p>
            </div>
        </section>

        <section class="pane">
            <div class="pane-head">
                <h2 class="pane-title">パレット</h2>
                <span class="pane-actions">
                    <button type="button" id="cp_palette_copy" class="btn icon tip" data-tip="コピー" data-pos="bottom" aria-label="HEX 一覧をコピー"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
                    <button type="button" id="cp_palette_save" class="btn icon tip" data-tip="画像で保存" data-pos="bottom" aria-label="画像で保存"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
                    <button type="button" id="cp_palette_clear" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg><span class="btn__text">クリア</span></button>
                </span>
            </div>
            <div class="pane-body cp-stack">
                <div id="cp_palette" class="cp-chips cp-chips--list" role="group" aria-label="パレット"></div>
                <p class="msg info" data-icon="info" id="cp_palette_note" aria-live="polite"></p>
            </div>
        </section>

        <!-- 合成：画像に色を乗せる（適用）か、乗せた層を外して下地に戻す（逆算）。計算は C.blendTables。 -->
        <section class="pane cp-image-blend">
            <div class="pane-head">
                <h2 class="pane-title">合成</h2>
                <span class="pane-actions">
                    <button type="button" id="cp_image_save" class="btn icon tip" data-tip="表示中の画像を保存" data-pos="bottom" data-align="end" aria-label="表示中の画像を保存" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
                </span>
            </div>
            <div class="pane-body cp-stack">
                <div class="cp-blend-top">
                    <label class="cbl">
                        <input type="checkbox" id="cp_image_blend" class="cb" disabled>
                        <span>画像にかける</span>
                    </label>
                    <div class="seg" role="radiogroup" aria-label="画像の向き">
                        <label><input type="radio" name="cp_image_direction" value="apply" checked><span>適用</span></label>
                        <label><input type="radio" name="cp_image_direction" value="undo"><span>逆算</span></label>
                    </div>
                </div>
                <div class="cp-blend-controls">
                    <label class="field">
                        <span class="field-label">モード</span>
                        <select id="cp_mode">
                            <option value="screen">スクリーン</option>
                            <option value="overlay">オーバーレイ</option>
                        </select>
                    </label>
                    <label class="field cp-blend-opacity">
                        <span class="field-label">不透明度</span>
                        <span class="cp-blend-opacity__row">
                            <input type="range" id="cp_opacity" min="0" max="100" step="1" value="100">
                            <output></output>
                        </span>
                    </label>
                </div>
                <div class="cp-slots">
                    <div class="cp-slot" data-slot="layer">
                        <button type="button" class="cp-slot__sw tip" data-tip="現在色にする" aria-label="合成色を現在色にする"></button>
                        <span class="cp-slot__name">合成色</span>
                        <input type="text" class="in in--hex cp-slot__hex" maxlength="7" spellcheck="false" autocomplete="off" aria-label="合成色の HEX">
                        <button type="button" class="btn cp-slot__take">現在色を入れる</button>
                    </div>
                </div>
                <p class="msg warn" data-icon="warn" id="cp_image_warn" aria-live="polite"></p>
            </div>
        </section>
    </div>
</main>

<script type="module" src="/examples/9/main.js"></script>
</body>
</html>
