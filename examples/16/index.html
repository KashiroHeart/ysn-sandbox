<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#16 Randactions | sandbox</title>
<link rel="stylesheet" href="/assets/examples-header.css">
<script src="/assets/examples-header.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/examples/16/main.css">
</head>
<body>
<!--
  画面は .app[data-screen] で切り替える（main.js）。
    title = タイトル（背景でランダムなステージを流す）、play = プレイ中、miss / clear = 結果ダイアログ
  タイトルの Easy / Hard（data-mode）で難易度を選ぶ。ステージは worker.js が先回りして作る。
  ステージは canvas に描く。画面内の文言はすべて英語にする。
-->
<div class="app" data-screen="title">
  <canvas class="field" id="field" tabindex="-1" aria-label="Stage"></canvas>

  <section class="title-screen" id="title" aria-labelledby="game-title">
    <div class="glyphs" aria-hidden="true">
      <svg viewBox="0 0 32 32"><path class="g-player" d="M16 1 31 31H1z"/></svg>
      <svg viewBox="0 0 32 32"><rect class="g-block" x="1" y="1" width="30" height="30"/><rect class="g-block-in" x="10" y="10" width="12" height="12"/></svg>
      <svg viewBox="0 0 32 32"><path class="g-diamond" d="M16 1.5 30.5 16 16 30.5 1.5 16z"/></svg>
      <svg viewBox="0 0 32 32"><circle class="g-goal" cx="16" cy="16" r="16"/></svg>
    </div>
    <h1 class="game-title" id="game-title">Randactions</h1>
    <p class="tagline">A new random stage every run.</p>
    <div class="start-buttons" role="group" aria-label="Start game">
      <button type="button" class="btn btn-primary btn-start" data-mode="easy">Easy</button>
      <button type="button" class="btn btn-primary btn-start" data-mode="hard">Hard</button>
    </div>
    <ul class="legend">
      <li><span class="key">A</span><span class="key">D</span><span>Move</span></li>
      <li><span class="key key-wide">Space</span><span>Jump</span></li>
      <li><svg class="mini" viewBox="0 0 32 32" aria-hidden="true"><circle class="g-goal" cx="16" cy="16" r="16"/></svg><span>Goal</span></li>
      <li><svg class="mini" viewBox="0 0 32 32" aria-hidden="true"><path class="g-diamond" d="M16 1.5 30.5 16 16 30.5 1.5 16z"/></svg><span>Miss on touch</span></li>
    </ul>
    <p class="legend-note">Hold Space to jump higher. Press it again in midair for a double jump.</p>
    <p class="touch-note">A keyboard is required to play.</p>
  </section>

  <div class="hud" id="hud" hidden>
    <span><span class="key">A</span><span class="key">D</span>Move</span>
    <span><span class="key key-wide">Space</span>Jump</span>
  </div>

  <div class="overlay" id="result" hidden>
    <div class="dialog" id="result-dialog" role="dialog" aria-modal="true" aria-labelledby="result-text" tabindex="-1">
      <p class="dialog-text" id="result-text"></p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-primary" data-action="replay">Replay</button>
        <button type="button" class="btn btn-ghost" data-action="title">Back to title</button>
      </div>
    </div>
  </div>
</div>

<noscript>
  <p class="noscript">JavaScript is required to play this game.</p>
</noscript>

<script src="/examples/16/core.js"></script>
<script src="/examples/16/main.js"></script>
</body>
</html>
