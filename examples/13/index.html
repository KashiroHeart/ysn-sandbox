<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#13 カラーピッカー（改） | sandbox</title>
<link rel="stylesheet" href="/assets/examples-header.css">
<script src="/assets/examples-header.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/no.13/main.css">
</head>
<body>
<header class="app">
    <div class="logo">
        <span class="logo-mark" aria-hidden="true">Cp</span>
        <h1 class="logo-name">Color Picker</h1>
    </div>
</header>

<noscript>
    <p class="msg err cp-noscript">JavaScript が無効なので使えません。</p>
</noscript>

<main class="cp-main">
    <section class="pane cp-col-image">
        <div class="pane-head">
            <h2 class="pane-title">画像</h2>
            <button type="button" class="cp-help tip wrap" data-tip="画像はブラウザの中だけで処理され、送信されません。" data-align="start" aria-label="画像の扱い"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg></button>
            <span class="cp-meta" id="cp_info" aria-live="polite"></span>
            <div class="cp-tools">
                <span class="cp-label" id="cp_sample_label">範囲</span>
                <div class="seg" role="radiogroup" aria-labelledby="cp_sample_label">
                    <label><input type="radio" name="cp_sample" value="1" checked><span>1px</span></label>
                    <label><input type="radio" name="cp_sample" value="3"><span>3×3</span></label>
                    <label><input type="radio" name="cp_sample" value="5"><span>5×5</span></label>
                </div>
                <span class="cp-anchor">
                    <button type="button" id="cp_image_save" class="btn icon tip" data-tip="表示中の画像を保存" data-pos="bottom" aria-label="表示中の画像を保存" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
                </span>
                <button type="button" id="cp_remove" class="btn icon tip" data-tip="画像を除去" data-pos="bottom" data-align="end" aria-label="画像を除去" disabled><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
            </div>
        </div>

        <div class="pane-body cp-stack">
            <div class="cp-frame is-empty" id="cp_frame">
                <canvas id="cp_canvas" class="cp-canvas" aria-label="画像。押した位置の色を現在色にします" hidden></canvas>
                <label class="cp-drop" id="cp_drop">
                    <input type="file" id="cp_file" class="cp-file" accept="image/*">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
                    <span class="cp-drop-title">画像を選択</span>
                    <span class="cp-drop-sub">ドロップ・貼り付けでも読み込めます</span>
                </label>
                <div class="cp-loupe" id="cp_loupe" aria-hidden="true" hidden><span class="cp-loupe-sw" id="cp_loupe_sw"></span><span id="cp_loupe_hex"></span></div>
                <p class="msg warn cp-frame-msg" id="cp_warn" role="status" hidden><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m10.29 3.86-8.47 14.14A2 2 0 0 0 3.53 21h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg><span id="cp_warn_text"></span></p>
            </div>

            <div>
                <h3 class="cp-sub">頻出色</h3>
                <div class="cp-freq is-empty" id="cp_frequent" role="group" aria-label="頻出色"></div>
            </div>
        </div>
    </section>

    <div class="cp-col-color">
        <section class="pane">
            <div class="pane-head"><h2 class="pane-title">現在色</h2></div>
            <div class="pane-body cp-stack">
                <button type="button" id="cp_swatch" class="cp-swatch tip" data-tip="パレットに追加" aria-label="パレットに追加"></button>
                <div class="cp-row">
                    <span class="cp-anchor is-block">
                        <input type="text" id="cp_hex" class="in cp-hex" aria-label="HEX" maxlength="7" spellcheck="false" autocomplete="off">
                    </span>
                    <span class="cp-anchor">
                        <button type="button" id="cp_copy" class="btn icon tip" data-tip="HEX をコピー" aria-label="HEX をコピー"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
                    </span>
                    <span class="cp-anchor">
                        <button type="button" id="cp_hold" class="btn primary"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg><span class="btn__text">パレットに追加</span></button>
                    </span>
                </div>
                <div class="cp-values"><span id="cp_rgb"></span><span id="cp_hsv_text"></span></div>
                <div class="cp-hsv">
                    <label class="cp-hsv-row"><span>H</span><input type="range" id="cp_h" class="cp-track" min="0" max="360" step="1" aria-label="色相"><output></output></label>
                    <label class="cp-hsv-row"><span>S</span><input type="range" id="cp_s" class="cp-track" min="0" max="100" step="1" aria-label="彩度"><output></output></label>
                    <label class="cp-hsv-row"><span>V</span><input type="range" id="cp_v" class="cp-track" min="0" max="100" step="1" aria-label="明度"><output></output></label>
                </div>
            </div>
        </section>

        <section class="pane">
            <div class="pane-head">
                <h2 class="pane-title">パレット</h2>
                <span class="spacer"></span>
                <span class="cp-anchor">
                    <button type="button" id="cp_palette_copy" class="btn icon tip" data-tip="HEX 一覧をコピー" data-pos="bottom" aria-label="HEX 一覧をコピー"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
                </span>
                <span class="cp-anchor">
                    <button type="button" id="cp_palette_save" class="btn icon tip" data-tip="画像で保存" data-pos="bottom" aria-label="画像で保存"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
                </span>
                <button type="button" id="cp_palette_clear" class="btn"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg><span class="btn__text">クリア</span></button>
            </div>
            <div class="pane-body">
                <p class="cp-empty" id="cp_palette_empty">「パレットに追加」した色がここに並びます。</p>
                <ul class="cp-list" id="cp_palette" aria-label="パレット"></ul>
            </div>
        </section>

        <details class="pane cp-fold" id="cp_blend_fold">
            <summary class="pane-head">
                <svg class="cp-chev" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg>
                <h2 class="pane-title">合成</h2>
                <span class="spacer"></span>
                <span class="cp-state" id="cp_blend_state" hidden></span>
                <span class="cp-mini" id="cp_blend_mini"></span>
                <span class="cp-meta" id="cp_blend_summary"></span>
            </summary>
            <div class="pane-body cp-stack">
                <label class="switch"><input type="checkbox" id="cp_image_blend" disabled><span></span>画像にかける</label>
                <div class="cp-field">
                    <span class="cp-flabel" id="cp_dir_label">向き<button type="button" class="cp-help tip wrap" data-tip="逆算は、乗せた色を外して元の色に戻します。" data-align="start" aria-label="向きについて"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg></button></span>
                    <div><div class="seg" role="radiogroup" aria-labelledby="cp_dir_label">
                        <label><input type="radio" name="cp_direction" value="apply" checked><span>適用</span></label>
                        <label><input type="radio" name="cp_direction" value="undo"><span>逆算</span></label>
                    </div></div>
                </div>
                <div class="cp-field">
                    <span class="cp-flabel" id="cp_mode_label">モード</span>
                    <div><div class="seg" role="radiogroup" aria-labelledby="cp_mode_label">
                        <label><input type="radio" name="cp_mode" value="screen" checked><span>スクリーン</span></label>
                        <label><input type="radio" name="cp_mode" value="overlay"><span>オーバーレイ</span></label>
                    </div></div>
                </div>
                <label class="cp-field">
                    <span class="cp-flabel">不透明度</span>
                    <span class="cp-op"><input type="range" id="cp_opacity" min="0" max="100" step="1" value="100"><output></output></span>
                </label>
                <div class="cp-field">
                    <span class="cp-flabel">合成色</span>
                    <div class="cp-row">
                        <button type="button" id="cp_layer_sw" class="cp-chip-sw tip" data-tip="現在色にする" aria-label="合成色を現在色にする"></button>
                        <span class="cp-anchor">
                            <input type="text" id="cp_layer_hex" class="in cp-layer-hex" aria-label="合成色の HEX" maxlength="7" spellcheck="false" autocomplete="off">
                        </span>
                        <button type="button" id="cp_layer_take" class="btn">現在色を入れる</button>
                    </div>
                </div>
            </div>
        </details>
    </div>
</main>

<script src="/no.13/main.js"></script>
</body>
</html>
