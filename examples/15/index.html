<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f6f8">
<title>#15 Randactions | sandbox</title>
<link rel="stylesheet" href="/assets/examples-header.css">
<script src="/assets/examples-header.js" defer></script>
<link rel="stylesheet" href="/examples/15/main.css">
</head>
<body>
<main id="arcade">
  <header class="mast">
    <div class="identity"><canvas id="brand" width="38" height="32" aria-hidden="true"></canvas><span>Sandbox Arcade</span></div>
    <div class="tools">
      <button type="button" id="sound" aria-label="Mute sound" title="Mute sound" aria-pressed="true"><canvas width="22" height="22" aria-hidden="true"></canvas></button>
      <button type="button" id="fullscreen" aria-label="Enter fullscreen" title="Enter fullscreen"><canvas width="22" height="22" aria-hidden="true"></canvas></button>
    </div>
  </header>
  <section class="cabinet" aria-label="Randactions game">
    <div class="strip"><span><i class="lamp"></i><span id="status">Title screen</span></span><span class="stage-size">25 × 22 <b>/</b> GRID</span></div>
    <div id="field" tabindex="-1" aria-label="Game field">
      <canvas id="scene" aria-hidden="true"></canvas>
      <div id="intro">
        <div class="title-emblem" aria-hidden="true"><i></i><span>✦</span><i></i></div>
        <h1 aria-label="Randactions"><canvas id="wordmark" width="860" height="120" aria-hidden="true"></canvas></h1>
        <p>A randomized platformer.</p>
        <button type="button" class="primary" id="start"><i class="play-icon"></i>Start game</button>
      </div>
      <dialog id="result" aria-labelledby="result-title"><div class="result-inner">
        <h2 id="result-title"></h2>
        <div class="actions"><button type="button" id="replay" class="primary">Replay</button><button type="button" id="back">Back to title</button></div>
      </div></dialog>
    </div>
  </section>
  <div id="touch" hidden><button data-action="left" aria-label="Move left">◀</button><button data-action="right" aria-label="Move right">▶</button><button data-action="jump">Jump</button></div>
  <div class="manual">
    <section><h2><span class="section-mark"></span>Controls</h2>
      <div class="keys"><span><kbd>A</kbd><kbd>D</kbd> Move</span><span><kbd>Space</kbd> Jump <small>/ Double jump</small></span></div>
    </section>
    <section><h2><span class="section-mark"></span>Stage key</h2>
      <div class="legend"><span><i class="sample player"></i>Player</span><span><i class="sample block"></i>Block</span><span><i class="sample hazard"></i>Hazard</span><span><i class="sample goal"></i>Goal</span></div>
    </section>
  </div>
</main>
<script type="module" src="/examples/15/main.js"></script>
</body>
</html>
