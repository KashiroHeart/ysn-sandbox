# sandbox.yoshina.moe（デザイン試作サイト）。静的ファイルを nginx がそのまま配る（アプリのプロセスは無い）。
#
# 配置: /etc/nginx/sites-enabled/sandbox.yoshina.moe.conf → /srv/ysn-sandbox/deploy/nginx/sandbox.yoshina.moe.conf の symlink
#       （初回は /srv で git clone、以降は /srv/ysn-sandbox で git pull）。この設定が変わったら nginx -t して reload。
# 文書ルートはクローンそのもの（/srv/ysn-sandbox）。公開してよい URL だけを location で拾い、ほかはすべて 404。

# HTTP は HTTPS へ寄せるだけ。
server {
    listen 80;
    listen [::]:80;
    server_name sandbox.yoshina.moe;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sandbox.yoshina.moe;

    ssl_certificate     /etc/letsencrypt/live/sandbox.yoshina.moe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sandbox.yoshina.moe/privkey.pem;

    root /srv/ysn-sandbox;
    charset utf-8;

    # 受け取るものが無い。
    client_max_body_size 1k;

    # トップ。index は「/」でだけ見せる（/index・/index.html は下の 404 に落ちる）。
    location = / {
        try_files /index.html =404;
    }

    # 以下 3 つの regex は上から順に評価され、下の prefix location より先に当たる。
    # try_files で見つけた *.html はその location のまま返る（再評価されない）ので、ここで弾いても正規の URL には効かない。

    # 拡張子付きの .html と、どの階層でも index という名前の URL は 404（リダイレクトもしない）。
    location ~ (\.html|/index)$ {
        return 404;
    }

    # ドットファイル（.git など）は出さない。
    location ~ /\. {
        return 404;
    }

    # example・designsheet のトップは末尾スラッシュ付き（/examples/1/ → examples/1/index.html）。
    # スラッシュなしの /examples/1 は下の prefix location で該当ファイルが無く 404。
    location ~ ^/(examples|designsheets)/\d+/$ {
        try_files ${uri}index.html =404;
    }

    # example・designsheet の中身。/examples/1/main.js はそのまま、/examples/1/foo は foo.html。
    # 一覧ページ（/examples/・/designsheets/）は置かないので、ファイルが無く 404。
    location /examples/ {
        try_files $uri $uri.html =404;
    }

    location /designsheets/ {
        try_files $uri $uri.html =404;
    }

    # 共通の CSS / JS。
    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }

    # 上に挙げていない URL（README.md・CLAUDE.md・deploy/ などクローンの残りを含む）はすべて 404。
    location / {
        return 404;
    }
}
